# More option see https://github.com/DreamMaoMao/mango/wiki/

# autostart
exec-once=ags-bar --hide-water-widget
exec-once=awww-daemon
exec-once=awww img ~/.local/share/wallpapers/clouds.jpg
exec-once=mpd-mpris
exec-once=yams
exec-once=musicpresence
exec-once=fcitx5
exec-once=anyrun daemon
exec-once=playerctld
exec-once=xwl-notifier

# monitors
monitorrule=name:DP-3,width:2560,height:1440,refresh:144,x:1920,y:0,scale:1.25
monitorrule=name:DP-2,width:1920,height:1080,refresh:60,x:0,y:0,scale:1

# Window effect
blur=1
blur_layer=1
blur_optimized=0
blur_params_num_passes = 2
blur_params_radius = 3
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

shadows = 1
layer_shadows = 0
shadow_only_floating = 0
shadows_size = 5
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0
shadowscolor = 0x000000ff

border_radius=10
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0

# Animation Configuration(support type:zoom,slide)
# tag_animation_direction: 1-horizontal,0-vertical
animations=1
layer_animations=1

animation_type_open=zoom
animation_type_close=zoom
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1

zoom_initial_ratio=0.87
zoom_end_ratio=1.0

fadein_begin_opacity=0
fadeout_begin_opacity=1

animation_duration_move=480
animation_duration_open=410
animation_duration_tag=195
animation_duration_close=200
animation_duration_focus=0

animation_curve_open=0.23,1,0.32,1
animation_curve_move=0.23,1,0.32,1
animation_curve_tag=0.5,0.5,0.75,1.0
animation_curve_close=0,0,1,1
animation_curve_focus=0.23,1,0.32,1
animation_curve_opafadeout=0.5,0.5,0.75,1.0
animation_curve_opafadein=0.5,0.5,0.75,1.0

# Scroller Layout Setting
#scroller_structs=20
#scroller_default_proportion=0.8
#scroller_focus_center=0
#scroller_prefer_center=0
#edge_scroller_pointer_focus=1
#edge_scroller_focus_allow_speed=0.0
#scroller_default_proportion_single=1.0
#scroller_proportion_preset=0.5,0.8,1.0

# Master-Stack Layout Setting
new_is_master=1
default_mfact=0.55
default_nmaster=1
tag_num=9
smartgaps=0

# Dwindle Layout Setting
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_hsplit=1
dwindle_vsplit=1
dwindle_preserve_split=0

# Overview Setting
#hotarea_size=10
#enable_hotarea=0
#ov_tab_mode=1
#ov_tab_mode_launch_next=0
#overviewgappi=5
#overviewgappo=30

# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idleinhibit_ignore_visible=0
sloppyfocus=1
warpcursor=1
focus_cross_monitor=1
focus_cross_tag=1
enable_floating_snap=0
snap_distance=30
cursor_size=24
drag_tile_to_tile=1
drag_tile_small=1

# keyboard
repeat_rate=25
repeat_delay=600
numlockon=0
xkb_rules_layout=us

# Trackpad
# need relogin to make it apply
disable_trackpad=1

# mouse
# need relogin to make it apply
mouse_natural_scrolling=0

# Appearance
gappih=5
gappiv=5
gappoh=10
gappov=10
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
borderpx=3

bordercolor=0x444444ff
# these are default for now
rootcolor=0x201b14ff
dropcolor=0x8FBA7C55
splitcolor=0xEB441EFF
focuscolor=0xffc8ddff
maximizescreencolor=0x89aa61ff
urgentcolor=0xad401fff
scratchpadcolor=0x516c93ff
globalcolor=0xb153a7ff
overlaycolor=0x14a57cff

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
tagrule=id:1,layout_name:dwindle
tagrule=id:2,layout_name:dwindle
tagrule=id:3,layout_name:dwindle
tagrule=id:4,layout_name:dwindle
tagrule=id:5,layout_name:dwindle
tagrule=id:6,layout_name:dwindle
tagrule=id:7,layout_name:dwindle
tagrule=id:8,layout_name:dwindle
tagrule=id:9,layout_name:dwindle

# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none

# reload config
bind=SUPER+SHIFT,r,reload_config

# convenience
bind=SUPER,r,spawn,anyrun
bind=SUPER,q,spawn,kitty
bind=SUPER,e,spawn,dolphin
bind=SUPER,l,spawn,hyprlock

# media
bind=SUPER,Z,spawn,amixer set Capture toggle

axisbind=SUPER+SHIFT,DOWN,spawn,rmpc volume -5
axisbind=SUPER+SHIFT,UP,spawn,rmpc volume +5

bind=NONE,code:164,spawn,rmpc togglepause

bindl=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindl=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl=NONE,XF86AudioNext,spawn,playerctl next
bindl=NONE,XF86AudioPause,spawn,playerctl play-pause
bindl=NONE,XF86AudioPlay,spawn,playerctl play-pause
bindl=NONE,XF86AudioPrev,spawn,playerctl previous

# screenshots
bind=SUPER,x,microshot
bind=SUPER+SHIFT,x,microshot --annotate
bind=SUPER+ALT,x,microshot --annotate --freeze

# exit
bind=SUPER,m,quit
bind=SUPER,c,killclient,
bind=SUPER+SHIFT,c,killclient,force

# switch window focus
bind=SUPER,Tab,focusstack,next
bind=ALT,Left,focusdir,left
bind=ALT,Right,focusdir,right
bind=ALT,Up,focusdir,up
bind=ALT,Down,focusdir,down

# swap window
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right

# switch window status
#bind=SUPER,g,toggleglobal,
#bind=ALT,Tab,togglejump,
bind=SUPER,v,togglefloating,
bind=SUPER,f,togglemaximizescreen,
bind=SUPER+SHIFT,f,togglefullscreen,
bind=ALT+SHIFT,f,togglefakefullscreen,
#bind=SUPER,i,minimized,
#bind=ALT,o,toggleoverlay,
#bind=SUPER+SHIFT,I,restore_minimized
#bind=ALT,z,toggle_scratchpad

# scroller layout
#bind=ALT,e,set_proportion,1.0
#bind=ALT,x,switch_proportion_preset,
#bind=alt+super+ctrl,Left,scroller_stack,left
#bind=alt+super+ctrl,Right,scroller_stack,right
#bind=alt+super+ctrl,Up,scroller_stack,up
#bind=alt+super+ctrl,Down,scroller_stack,down

#dwindle layout(manual split mode)
bind=SUPER,j,dwindle_toggle_split_direction

# switch layout
#bind=SUPER,n,switch_layout

# tag switch
#bind=SUPER,Left,viewtoleft,0
#bind=CTRL,Left,viewtoleft_have_client,0
#bind=SUPER,Right,viewtoright,0
#bind=CTRL,Right,viewtoright_have_client,0
#bind=CTRL+SUPER,Left,tagtoleft,0
#bind=CTRL+SUPER,Right,tagtoright,0

bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

# tag: move client to the tag and focus it
# tagsilent: move client to the tag and not focus it
# bind=Alt,1,tagsilent,1
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# monitor switch
bind=alt+shift,Left,focusmon,left
bind=alt+shift,Right,focusmon,right
bind=SUPER+Alt,Left,tagmon,left
bind=SUPER+Alt,Right,tagmon,right

# gaps
#bind=ALT+SHIFT,X,incgaps,1
#bind=ALT+SHIFT,Z,incgaps,-1
#bind=ALT+SHIFT,R,togglegaps

# movewin
#bind=CTRL+SHIFT,Up,movewin,+0,-50
#bind=CTRL+SHIFT,Down,movewin,+0,+50
#bind=CTRL+SHIFT,Left,movewin,-50,+0
#bind=CTRL+SHIFT,Right,movewin,+50,+0

# resizewin
#bind=SUPER+ALT,Up,resizewin,+0,-50
#bind=SUPER+ALT,Down,resizewin,+0,+50
#bind=SUPER+ALT,Left,resizewin,-50,+0
#bind=SUPER+ALT,Right,resizewin,+50,+0

# Mouse Button Bindings
# btn_left and btn_right can't bind none mod key
mousebind=SUPER,btn_left,moveresize,curmove
#mousebind=NONE,btn_middle,togglemaximizescreen,0
mousebind=SUPER,btn_right,moveresize,curresize

# Axis Bindings
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# layer rule
#layerrule=animation_type_open:zoom,layer_name:rofi
#layerrule=animation_type_close:zoom,layer_name:rofi

# window rules
windowrule=ignore_maximize:1,appid:.*
windowrule=isfloating:1,isglobal:1,isoverlay:1,title:^(Picture-in-Picture)$
