[bar.default]
capsule_radius = 6
center = [ "active_window" ]
concave_edge_corners = false
end = [ "tray", "notifications", "bluetooth", "input_volume", "volume", "clock" ]
font_weight = 700
margin_edge = 8
margin_ends = 8
start = [ "control-center", "workspaces", "media" ]
thickness = 46
widget_spacing = 14

[control_center]
hidden_tabs = [ "power", "weather", "screen-time" ]
width = 800

    [[control_center.shortcuts]]
    type = "caffeine"

    [[control_center.shortcuts]]
    type = "nightlight"

    [[control_center.shortcuts]]
    type = "notification"

    [[control_center.shortcuts]]
    type = "session"

[desktop_widgets]
enabled = false

[location]
address = "Charlottenburg, Berlin"

[lockscreen]
fingerprint = false

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-3", "lockscreen-login-box@DP-2" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-2"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "DP-2"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-3"]
    box_height = 196.0
    box_width = 810.0
    cx = 1024.0
    cy = 970.0
    output = "DP-3"
    placement_height = 1152.0
    placement_width = 2048.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-3".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[notification]
filter_order = [ "filter" ]

    [notification.filter.filter]
    allow_permanent = true
    bypass_dnd = false
    enabled = true
    match = "microshot"
    play_sound = true
    save_history = false
    show_toast = true

	[notification.filter.xwlnotifier]
	allow_permanent = true
	bypass_dnd = false
	enabled = true
	match = "xwl-notifier-rs"
	play_sound = true
	save_history = false
	show_toast = true

[osd]
background_opacity = 0.89999997988343239

    [osd.kinds]
    bluetooth = false
    brightness = false
    dnd = false
    keyboard_backlight = false
    lock_keys = false
    media = false
    power_profile = false
    volume = false
    wifi = false

[shell]
avatar_path = "/home/ashley/Documents/Art/pfp.jpg"
clipboard_enabled = false
clipboard_keep_from_closed_apps = false
font_family = "JetBrainsMono Nerd Font"

    [shell.launcher]
    categories = false

    [shell.screenshot]
    save_to_file = false

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = false
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 0.0
    enabled = false
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

[system.monitor]
enabled = false

[theme]
builtin = "Rosé Pine"

    [theme.templates]
    enable_builtin_templates = false

[wallpaper]
directory = "/home/ashley/.local/share/wallpapers"

    [wallpaper.default]
    path = "/home/ashley/.local/share/wallpapers/clouds.jpg"

    [wallpaper.last]
    path = "/home/ashley/.local/share/wallpapers/clouds.jpg"

    [wallpaper.monitors.DP-2]
    path = "/home/ashley/.local/share/wallpapers/clouds.jpg"

    [wallpaper.monitors.DP-3]
    path = "/home/ashley/.local/share/wallpapers/clouds.jpg"

[widget.active_window]
display = "text_only"
interactive = false
max_length = 800

[widget.control-center]
glyph = "menu-2"
scale = 1.25

[widget.media]
artist_first = true
hide_album_art = true
max_length = 450

[widget.tray]
drawer = true
drawer_columns = 5

[widget.workspaces]
interactive = false
style = "minimal"
